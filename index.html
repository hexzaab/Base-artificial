<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuralText — Fast Browser RLHF AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Fullscreen Loading & Boot Overlay with Live Logs -->
  <div id="loading-overlay" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4 transition-opacity duration-300">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin"></div>
        <div>
          <h2 id="loader-title" class="text-sm font-bold text-white">Initializing Neural Engine</h2>
          <p id="loader-subtitle" class="text-xs text-slate-400">Starting background AI worker...</p>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
        <div id="loader-bar" class="h-full bg-indigo-500 transition-all duration-200" style="width: 10%"></div>
      </div>

      <!-- Live Boot / Training Logs -->
      <div id="loader-logs" class="bg-slate-950 border border-slate-800/80 rounded-xl p-3 h-36 overflow-y-auto font-mono text-[11px] text-slate-400 space-y-1">
        <div>[SYS] Preparing background worker thread...</div>
      </div>
    </div>
  </div>

  <!-- Minimalist Top Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-sm text-white">
          AI
        </div>
        <div>
          <h1 class="text-sm font-bold text-white leading-tight">NeuralText RLHF</h1>
          <p class="text-[11px] text-slate-400">Zero-Lag Worker Neural Net</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span id="worker-badge" class="text-[11px] px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">
          ● Ready
        </span>
        <button onclick="resetMemory()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-rose-950 hover:text-rose-300 border border-slate-700 text-slate-300 transition">
          Reset
        </button>
      </div>
    </div>
  </header>

  <!-- Main Clean Workspace -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-12 gap-4">

    <!-- Left Column: Chat & RLHF Arena (7 cols) -->
    <section class="md:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col overflow-hidden min-h-[480px]">
      <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
        <span class="text-xs font-semibold text-slate-300">AI Output Stream</span>
        <button onclick="requestGenerate()" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-semibold transition">
          + New Message
        </button>
      </div>

      <!-- Messages List -->
      <div id="chat-stream" class="flex-1 p-4 overflow-y-auto space-y-3"></div>

      <!-- Optional Seed Input -->
      <form onsubmit="handleSeedSubmit(event)" class="p-3 border-t border-slate-800 bg-slate-950/50 flex gap-2">
        <input id="seed-input" type="text" placeholder="Type starting words (optional)..."
          class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" />
        <button type="submit" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold transition">
          Send
        </button>
      </form>
    </section>

    <!-- Right Column: Dataset & Stats (5 cols) -->
    <section class="md:col-span-5 flex flex-col gap-4">

      <!-- Clean Stats Row -->
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
          <div class="text-[10px] text-slate-400 uppercase">Words</div>
          <div id="stat-vocab" class="text-lg font-bold text-white mt-0.5">0</div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
          <div class="text-[10px] text-slate-400 uppercase">Good / Bad</div>
          <div id="stat-rlhf" class="text-lg font-bold text-indigo-400 mt-0.5">0 / 0</div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
          <div class="text-[10px] text-slate-400 uppercase">Loss</div>
          <div id="stat-loss" class="text-lg font-bold text-emerald-400 mt-0.5">—</div>
        </div>
      </div>

      <!-- Teach Custom Dataset -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-semibold text-white">Teach New Sentences (Dataset)</h2>
          <span class="text-[11px] text-slate-400">1 per line</span>
        </div>

        <textarea id="dataset-input" rows="7"
          class="w-full flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition resize-none font-mono leading-relaxed"
          placeholder="Add sentences here..."></textarea>

        <div class="flex items-center justify-between text-xs text-slate-400">
          <span>Creativity: <strong id="temp-label" class="text-slate-200">0.70</strong></span>
          <input id="temp-slider" type="range" min="0.2" max="1.3" step="0.05" value="0.70"
            oninput="document.getElementById('temp-label').innerText = parseFloat(this.value).toFixed(2)"
            class="w-32 accent-indigo-500 cursor-pointer" />
        </div>

        <button onclick="trainCustomDataset()"
          class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white text-xs font-semibold transition">
          Train & Save to Memory
        </button>
      </div>

    </section>
  </main>

  <!-- =========================================================
       BACKGROUND WEB WORKER SCRIPT (ZERO UI LAG)
       ========================================================= -->
  <script id="worker-code" type="javascript/worker">
    importScripts('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');

    let model = null;
    let word2idx = {};
    let idx2word = {};
    let vocabSize = 0;
    const MAX_SEQ_LEN = 8;

    function log(msg) {
      self.postMessage({ type: 'LOG', msg });
    }

    function cleanText(text) {
      return text.toLowerCase().replace(/[^a-z0-9'\s]/g, '').replace(/\s+/g, ' ').trim();
    }

    function buildVocab(sentences) {
      const specials = ['<PAD>', '<START>', '<END>', '<UNK>'];
      const set = new Set();
      sentences.forEach(s => {
        const c = cleanText(s);
        if (c) c.split(' ').forEach(w => set.add(w));
      });
      const tokens = [...specials, ...Array.from(set)];
      word2idx = {};
      idx2word = {};
      tokens.forEach((t, i) => {
        word2idx[t] = i;
        idx2word[i] = t;
      });
      vocabSize = tokens.length;
    }

    function buildFastModel(vSize) {
      if (model) model.dispose();
      const m = tf.sequential();
      // Fast lightweight architecture: Embedding -> Pooling -> Dense
      m.add(tf.layers.embedding({
        inputDim: vSize,
        outputDim: 20,
        inputLength: MAX_SEQ_LEN
      }));
      m.add(tf.layers.flatten());
      m.add(tf.layers.dense({ units: 48, activation: 'relu' }));
      m.add(tf.layers.dense({ units: vSize, activation: 'softmax' }));
      m.compile({
        optimizer: tf.train.adam(0.02),
        loss: 'sparseCategoricalCrossentropy'
      });
      return m;
    }

    function makeTensors(sentences) {
      const X = [];
      const y = [];
      sentences.forEach(line => {
        const c = cleanText(line);
        if (!c) return;
        const toks = ['<START>', ...c.split(' '), '<END>'];
        for (let i = 1; i < toks.length; i++) {
          const ctx = toks.slice(0, i).slice(-MAX_SEQ_LEN);
          const seq = new Array(MAX_SEQ_LEN).fill(0);
          const offset = MAX_SEQ_LEN - ctx.length;
          ctx.forEach((t, idx) => {
            seq[offset + idx] = word2idx[t] ?? 3;
          });
          X.push(seq);
          y.push(word2idx[toks[i]] ?? 3);
        }
      });
      return {
        xs: tf.tensor2d(X, [X.length, MAX_SEQ_LEN], 'int32'),
        ys: tf.tensor1d(y, 'float32')
      };
    }

    async function exportWeights() {
      const weightTensors = model.getWeights();
      const serialized = [];
      for (let w of weightTensors) {
        serialized.push({
          shape: w.shape,
          data: Array.from(await w.data())
        });
      }
      return serialized;
    }

    async function importWeights(serialized) {
      const tensors = serialized.map(w => tf.tensor(w.data, w.shape));
      model.setWeights(tensors);
      tensors.forEach(t => t.dispose());
    }

    function sample(probs, temp) {
      probs[0] = 0; // no <PAD>
      probs[1] = 0; // no <START>
      const logits = probs.map(p => Math.log(Math.max(p, 1e-8)) / temp);
      const maxL = Math.max(...logits);
      const exps = logits.map(l => Math.exp(l - maxL));
      const sum = exps.reduce((a, b) => a + b, 0);
      const norm = exps.map(e => e / sum);
      let r = Math.random();
      for (let i = 0; i < norm.length; i++) {
        r -= norm[i];
        if (r <= 0) return i;
      }
      return norm.length - 1;
    }

    self.onmessage = async (e) => {
      const { type, payload } = e.data;

      if (type === 'INIT') {
        log('[TF.JS] Loading TensorFlow backend in worker...');
        await tf.ready();
        log(`[TF.JS] Backend ready (${tf.getBackend()}).`);

        if (payload.savedState) {
          log('[MEM] Restoring saved vocabulary & weights from localStorage...');
          word2idx = payload.savedState.word2idx;
          idx2word = payload.savedState.idx2word;
          vocabSize = payload.savedState.vocabSize;
          model = buildFastModel(vocabSize);
          await importWeights(payload.savedState.weights);
          log(`[MEM] Restored ${vocabSize} words successfully.`);
          self.postMessage({
            type: 'READY',
            payload: { vocabSize, loss: payload.savedState.loss || '0.45' }
          });
        } else {
          log('[TRAIN] Building initial vocabulary from starter corpus...');
          buildVocab(payload.corpus);
          model = buildFastModel(vocabSize);
          const { xs, ys } = makeTensors(payload.corpus);
          let lastLoss = 0;
          await model.fit(xs, ys, {
            epochs: 22,
            batchSize: 16,
            shuffle: true,
            callbacks: {
              onEpochEnd: (ep, logs) => {
                lastLoss = logs.loss.toFixed(3);
                const pct = Math.round(((ep + 1) / 22) * 100);
                self.postMessage({ type: 'PROGRESS', pct, msg: `Epoch ${ep + 1}/22 — loss: ${lastLoss}` });
              }
            }
          });
          xs.dispose(); ys.dispose();
          const weights = await exportWeights();
          self.postMessage({
            type: 'TRAINED',
            payload: { vocabSize, word2idx, idx2word, weights, loss: lastLoss }
          });
        }
      }

      if (type === 'TRAIN_FULL') {
        log('[TRAIN] Rebuilding vocabulary & training on updated dataset...');
        buildVocab(payload.corpus);
        model = buildFastModel(vocabSize);
        const { xs, ys } = makeTensors(payload.corpus);
        let lastLoss = 0;
        await model.fit(xs, ys, {
          epochs: 25,
          batchSize: 16,
          shuffle: true,
          callbacks: {
            onEpochEnd: (ep, logs) => {
              lastLoss = logs.loss.toFixed(3);
              const pct = Math.round(((ep + 1) / 25) * 100);
              self.postMessage({ type: 'PROGRESS', pct, msg: `Training step ${ep + 1}/25 — loss: ${lastLoss}` });
            }
          }
        });
        xs.dispose(); ys.dispose();
        const weights = await exportWeights();
        self.postMessage({
          type: 'TRAINED',
          payload: { vocabSize, word2idx, idx2word, weights, loss: lastLoss }
        });
      }

      if (type === 'RLHF_UPDATE') {
        const { corpus, isGood, text, temp } = payload;
        const batch = isGood ? [text, text, ...corpus.slice(-5)] : corpus;
        const { xs, ys } = makeTensors(batch);
        let lastLoss = 0;
        await model.fit(xs, ys, {
          epochs: isGood ? 6 : 8,
          batchSize: 16,
          shuffle: true,
          callbacks: {
            onEpochEnd: (_, logs) => { lastLoss = logs.loss.toFixed(3); }
          }
        });
        xs.dispose(); ys.dispose();
        const weights = await exportWeights();
        self.postMessage({
          type: 'RLHF_DONE',
          payload: { weights, loss: lastLoss, nextTemp: isGood ? temp : Math.min(1.3, temp + 0.2) }
        });
      }

      if (type === 'GENERATE') {
        const { seed, temp } = payload;
        const cleaned = cleanText(seed || '');
        let toks = ['<START>'];
        if (cleaned) toks.push(...cleaned.split(' '));

        for (let i = 0; i < 14; i++) {
          const ctx = toks.slice(-MAX_SEQ_LEN);
          const seq = new Array(MAX_SEQ_LEN).fill(0);
          const offset = MAX_SEQ_LEN - ctx.length;
          ctx.forEach((t, idx) => { seq[offset + idx] = word2idx[t] ?? 3; });

          const nextIdx = tf.tidy(() => {
            const inp = tf.tensor2d([seq], [1, MAX_SEQ_LEN], 'int32');
            const out = model.predict(inp);
            return sample(Array.from(out.dataSync()), temp);
          });

          const word = idx2word[nextIdx];
          if (!word || word === '<END>' || word === '<PAD>') break;
          toks.push(word);
        }

        const result = toks.filter(t => !['<START>', '<END>', '<PAD>', '<UNK>'].includes(t)).join(' ') || 'hello i am learning';
        self.postMessage({ type: 'GENERATED', payload: { text: result, seed: cleaned } });
      }
    };
  </script>

  <!-- =========================================================
       MAIN UI CONTROLLER (LIGHTWEIGHT & RESPONSIVE)
       ========================================================= -->
  <script>
    const STORAGE_KEY = 'neuraltext_fast_worker_v1';
    const STARTER_DATA = [
      "hello friend how are you doing today",
      "i am a fast neural network running in a worker",
      "give me good feedback and i will learn your style",
      "bad outputs help me fix my weights automatically",
      "coding on mobile is fast when heavy math runs in workers",
      "system is online and ready for your custom dataset",
      "let us build awesome web apps together right now"
    ];

    let appState = {
      corpus: [...STARTER_DATA],
      goodCount: 0,
      badCount: 0,
      vocabSize: 0,
      loss: '—',
      word2idx: {},
      idx2word: {},
      weights: null
    };

    // Spawn Web Worker from inline script
    const workerBlob = new Blob([document.getElementById('worker-code').textContent], { type: 'application/javascript' });
    const aiWorker = new Worker(URL.createObjectURL(workerBlob));

    // Loading Overlay Helpers
    function showLoader(title, subtitle) {
      document.getElementById('loader-title').innerText = title;
      document.getElementById('loader-subtitle').innerText = subtitle;
      document.getElementById('loader-bar').style.width = '10%';
      const overlay = document.getElementById('loading-overlay');
      overlay.classList.remove('hidden', 'opacity-0');
    }

    function hideLoader() {
      const overlay = document.getElementById('loading-overlay');
      overlay.classList.add('opacity-0');
      setTimeout(() => overlay.classList.add('hidden'), 280);
    }

    function appendLoaderLog(text) {
      const box = document.getElementById('loader-logs');
      const div = document.createElement('div');
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function setBadge(busy) {
      const badge = document.getElementById('worker-badge');
      if (busy) {
        badge.className = "text-[11px] px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium";
        badge.innerText = "● Thinking...";
      } else {
        badge.className = "text-[11px] px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium";
        badge.innerText = "● Ready";
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn("LocalStorage full or blocked:", e);
      }
    }

    function updateStats() {
      document.getElementById('stat-vocab').innerText = appState.vocabSize;
      document.getElementById('stat-rlhf').innerText = `${appState.goodCount} / ${appState.badCount}`;
      document.getElementById('stat-loss').innerText = appState.loss;
    }

    // Worker Message Router
    aiWorker.onmessage = (e) => {
      const { type, payload, pct, msg } = e.data;

      if (type === 'LOG') {
        appendLoaderLog(msg);
      }

      if (type === 'PROGRESS') {
        document.getElementById('loader-bar').style.width = pct + '%';
        appendLoaderLog(`[TRAIN] ${msg}`);
      }

      if (type === 'READY') {
        appState.vocabSize = payload.vocabSize;
        appState.loss = payload.loss;
        updateStats();
        hideLoader();
        requestGenerate();
      }

      if (type === 'TRAINED') {
        appState.vocabSize = payload.vocabSize;
        appState.word2idx = payload.word2idx;
        appState.idx2word = payload.idx2word;
        appState.weights = payload.weights;
        appState.loss = payload.loss;
        saveState();
        updateStats();
        appendLoaderLog('[MEM] Saved weights to localStorage.');
        setTimeout(() => {
          hideLoader();
          requestGenerate();
        }, 300);
      }

      if (type === 'RLHF_DONE') {
        appState.weights = payload.weights;
        appState.loss = payload.loss;
        saveState();
        updateStats();
        setBadge(false);
        requestGenerate('', payload.nextTemp);
      }

      if (type === 'GENERATED') {
        setBadge(false);
        renderMessageCard(payload.text, payload.seed);
      }
    };

    // Boot Sequence
    window.addEventListener('DOMContentLoaded', () => {
      const raw = localStorage.getItem(STORAGE_KEY);
      let saved = null;
      if (raw) {
        try {
          saved = JSON.parse(raw);
          appState = { ...appState, ...saved };
          appendLoaderLog('[MEM] Found saved AI model in localStorage.');
        } catch (e) {}
      }
      document.getElementById('dataset-input').value = appState.corpus.join('\n');
      aiWorker.postMessage({
        type: 'INIT',
        payload: { corpus: appState.corpus, savedState: saved?.weights ? saved : null }
      });
    });

    // User Actions
    function requestGenerate(seed = '', tempOverride = null) {
      setBadge(true);
      const temp = tempOverride ?? parseFloat(document.getElementById('temp-slider').value);
      aiWorker.postMessage({ type: 'GENERATE', payload: { seed, temp } });
    }

    function handleSeedSubmit(e) {
      e.preventDefault();
      const inp = document.getElementById('seed-input');
      requestGenerate(inp.value.trim());
      inp.value = '';
    }

    function trainCustomDataset() {
      const lines = document.getElementById('dataset-input').value
        .split('\n').map(l => l.trim()).filter(Boolean);
      if (!lines.length) return alert('Add at least one sentence first.');
      appState.corpus = lines;
      document.getElementById('loader-logs').innerHTML = '';
      showLoader('Training Neural Network', 'Updating vocabulary & weights in background...');
      aiWorker.postMessage({ type: 'TRAIN_FULL', payload: { corpus: appState.corpus } });
    }

    function rateOutput(cardId, isGood, text) {
      const card = document.getElementById(cardId);
      if (!card || card.dataset.done) return;
      card.dataset.done = '1';

      card.querySelectorAll('button').forEach(b => b.remove());
      const tag = card.querySelector('.status-tag');

      if (isGood) {
        appState.goodCount++;
        tag.innerHTML = `<span class="text-emerald-400 font-semibold">👍 Learned</span>`;
        if (!appState.corpus.includes(text)) {
          appState.corpus.push(text);
          document.getElementById('dataset-input').value = appState.corpus.join('\n');
        }
      } else {
        appState.badCount++;
        tag.innerHTML = `<span class="text-rose-400 font-semibold">👎 Self-Correcting</span>`;
      }

      updateStats();
      setBadge(true);
      const temp = parseFloat(document.getElementById('temp-slider').value);
      aiWorker.postMessage({
        type: 'RLHF_UPDATE',
        payload: { corpus: appState.corpus, isGood, text, temp }
      });
    }

    function renderMessageCard(text, seed) {
      const stream = document.getElementById('chat-stream');
      const id = 'msg-' + Date.now() + Math.random().toString(36).slice(2, 6);
      const safeText = text.replace(/'/g, "\\'").replace(/"/g, '&quot;');

      const div = document.createElement('div');
      div.id = id;
      div.className = "bg-slate-950/90 border border-slate-800 rounded-xl p-3.5 space-y-2.5";
      div.innerHTML = `
        <div class="flex items-center justify-between text-[11px]">
          <span class="text-indigo-400 font-semibold">AI ${seed ? `· "${seed}"` : ''}</span>
          <span class="status-tag text-slate-500">Rate output</span>
        </div>
        <p class="text-sm text-slate-100 leading-relaxed">${text}</p>
        <div class="flex gap-2 pt-1">
          <button onclick="rateOutput('${id}', true, '${safeText}')"
            class="px-3 py-1 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 text-emerald-300 text-xs font-medium transition">
            👍 Good
          </button>
          <button onclick="rateOutput('${id}', false, '${safeText}')"
            class="px-3 py-1 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-300 text-xs font-medium transition">
            👎 Bad
          </button>
        </div>
      `;
      stream.appendChild(div);
      stream.scrollTop = stream.scrollHeight;
    }

    function resetMemory() {
      if (!confirm('Reset all learned weights and custom dataset?')) return;
      localStorage.removeItem(STORAGE_KEY);
      appState = {
        corpus: [...STARTER_DATA],
        goodCount: 0,
        badCount: 0,
        vocabSize: 0,
        loss: '—',
        word2idx: {},
        idx2word: {},
        weights: null
      };
      document.getElementById('dataset-input').value = appState.corpus.join('\n');
      document.getElementById('chat-stream').innerHTML = '';
      document.getElementById('loader-logs').innerHTML = '';
      showLoader('Resetting AI Memory', 'Rebuilding clean model...');
      aiWorker.postMessage({ type: 'INIT', payload: { corpus: appState.corpus, savedState: null } });
    }
  </script>
</body>
</html>
